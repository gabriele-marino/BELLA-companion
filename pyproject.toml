[project]
name = "bella-companion"
version = "0.1.51"
description = "Companion tool with experiments and evaluation for Bayesian Evolutionary Layered Learning Architectures (BELLA) BEAST2 package."
readme = "README.md"
authors = [
    { name = "gabriele-marino", email = "gabmarino.8601@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "arviz==0.22.0",
    "beartype>=0.22.9",
    "jaxtyping>=0.3.7",
    "kaleido>=1.2.0",
    "phylogenie>=3.10.0",
    "plotly>=6.5.0",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "joblib-stubs>=1.5.2.0.20250831",
    "pandas-stubs>=2.3.2.250926",
    "plotly-stubs>=0.0.6",
    "pyright>=1.1.409",
    "scipy-stubs>=1.15.3.0",
]

[project.scripts]
bella = "bella_companion.main:main"

[tool.pyright]
typeCheckingMode = "strict"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
